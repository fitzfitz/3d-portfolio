<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A ship locked in orbit around a planet">
  <defs>
    <radialGradient id="sky" cx=".32" cy=".24" r=".95">
      <stop offset="0" stop-color="#141b46"/>
      <stop offset=".55" stop-color="#080a20"/>
      <stop offset="1" stop-color="#04030d"/>
    </radialGradient>
    <radialGradient id="planet" cx=".34" cy=".30" r=".82">
      <stop offset="0" stop-color="#a9fbff"/>
      <stop offset=".30" stop-color="#2ad4f0"/>
      <stop offset=".64" stop-color="#0b7ba6"/>
      <stop offset="1" stop-color="#04182c"/>
    </radialGradient>
    <radialGradient id="air" cx=".5" cy=".5" r=".5">
      <stop offset=".70" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset=".80" stop-color="#00f0ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="11" y1="10.6" x2="21.5" y2="21.5">
      <stop offset="0" stop-color="#d6fdff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#d6fdff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#d6fdff" stop-opacity="0"/>
    </linearGradient>
    <!-- Far half of the orbit: brightest where it emerges past the planet's
         limb, faintest at the top where it is deepest behind the planet. -->
    <linearGradient id="far" gradientUnits="userSpaceOnUse" x1="4" y1="16" x2="28" y2="16">
      <stop offset="0" stop-color="#00ff87" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#00ff87" stop-opacity=".20"/>
      <stop offset="1" stop-color="#00ff87" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="spark" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eafff5" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#00ff87" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00ff87" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wake" gradientUnits="userSpaceOnUse" x1="-1.5" y1="0" x2="-5" y2="0">
      <stop offset="0" stop-color="#9dffd2" stop-opacity=".8"/>
      <stop offset="1" stop-color="#00ff87" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="behind"><rect x="-2" y="-6" width="36" height="22"/></clipPath>
    <clipPath id="infront"><rect x="-2" y="16" width="36" height="22"/></clipPath>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#sky)"/>

  <g fill="#dbe7ff">
    <circle cx="6.4" cy="6.2" r=".48" opacity=".42"/>
    <circle cx="25.8" cy="25.4" r=".4" opacity=".30"/>
    <circle cx="8.6" cy="26.2" r=".34" opacity=".24"/>
  </g>

  <!-- Orbit, far half — drawn first so the planet occludes it. -->
  <g transform="rotate(-20 16 16)">
    <g clip-path="url(#behind)">
      <ellipse cx="16" cy="16" rx="12" ry="4.7" fill="none" stroke="url(#far)" stroke-width="1.15"/>
    </g>
  </g>

  <circle cx="16" cy="16" r="8.6" fill="url(#air)"/>
  <circle cx="16" cy="16" r="6.8" fill="url(#planet)"/>
  <circle cx="16" cy="16" r="6.8" fill="none" stroke="url(#rim)" stroke-width=".7"/>

  <!-- Orbit, near half — drawn over the planet, at full strength. -->
  <g transform="rotate(-20 16 16)">
    <g clip-path="url(#infront)">
      <ellipse cx="16" cy="16" rx="12" ry="4.7" fill="none" stroke="#00ff87" stroke-opacity=".16" stroke-width="3"/>
      <ellipse cx="16" cy="16" rx="12" ry="4.7" fill="none" stroke="#00ff87" stroke-width="1.35"/>
    </g>
  </g>

  <!-- Ship, riding the near arc, nose along the tangent. -->
  <g transform="translate(19.92 19.47) rotate(155.24)">
    <circle r="2.4" fill="url(#spark)"/>
    <path d="M-1.5-.75 L-5 0 L-1.5.75Z" fill="url(#wake)"/>
    <!-- The dark stroke, laid under the fill, carves the hull out of the orbit
         line it sits on; without it the two fuse into an arrowhead. -->
    <path d="M2 0 L-1.5 1.5 L-.8 0 L-1.5-1.5Z" fill="#f2fffa"
          stroke="#03101d" stroke-width=".5" stroke-linejoin="round" paint-order="stroke"/>
  </g>
</svg>
