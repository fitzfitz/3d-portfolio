name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: it mints an OIDC token to authenticate the
# deployment, so id-token: write is not optional.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. cancel-in-progress is deliberately false: a
# half-finished Pages deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Unit tests only. The e2e suite needs a real Chrome at a hardcoded local
      # path (tests/e2e/harness.mjs CHROME) and is a local/manual gate.
      - run: npm test

      - name: Build for the project-page subpath
        env:
          BASE_PATH: /3d-portfolio/
          # Without this the contact form does not merely misbehave — it ceases
          # to exist. Contact.tsx reads the key at build time, so an unset
          # variable makes `accessKey` a compile-time "", which makes
          # `!accessKey` statically true, and the minifier then eliminates the
          # entire form branch. The deployed bundle contained zero occurrences
          # of "web3forms", "access_key" or "botcheck" until this line existed;
          # visitors got the mailto fallback with no way to tell it was a
          # degradation. A missing secret still degrades that way rather than
          # failing the build, so if the form vanishes again, check here first.
          VITE_FORM_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
