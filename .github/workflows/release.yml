# Production: a version tag (v1.2.0) deploys that commit to the Cloudflare
# Worker `3d-portfolio`, which serves porto.fitzgeral.my.id and
# 3d-portfolio.fitzgeralmedia.workers.dev. Merges to main only reach staging
# (staging.yml), so check a commit there before tagging it:
#
#   gh release create v1.2.0 --target main --generate-notes
#
# Rolling back needs no new tag: re-run this workflow's run for the previous
# tag (Actions → that run → Re-run all jobs), or `npx wrangler rollback`.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (the "Edit Cloudflare
# Workers" template, scoped to this account) and CLOUDFLARE_ACCOUNT_ID.
# Workers Builds must stay disconnected in the Cloudflare dashboard, or every
# push to main would still deploy production behind this workflow's back.
name: Release to production (Cloudflare)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One production deploy at a time, and never cancel one halfway.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://porto.fitzgeral.my.id
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the tag can be checked against main below.
          fetch-depth: 0

      # Production only ships what staging already had: a tag on a commit that
      # never reached main (a pushed feature branch, a local experiment) stops
      # here instead of going live untested.
      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag not on main::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge it first so staging has it, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Same check as staging.yml: a missing key silently drops the contact
      # form from the bundle, so say so loudly.
      - name: Warn if the contact form will fall back to mailto
        env:
          VITE_FORM_KEY: ${{ secrets.VITE_FORM_KEY }}
        run: |
          if [ -z "$VITE_FORM_KEY" ]; then
            echo "::warning title=Contact form disabled::VITE_FORM_KEY is unset, so Contact.tsx renders a mailto: link and the form is dropped from the bundle. Set the VITE_FORM_KEY repository secret to enable it."
          else
            echo "VITE_FORM_KEY is set (${#VITE_FORM_KEY} chars); the contact form will be built."
          fi

      # Served from the domain root, so no BASE_PATH. VITE_BEACON_API and
      # VITE_LIVE_SKY come from the committed .env.production, as on staging.
      - name: Build for the domain root
        env:
          VITE_FORM_KEY: ${{ secrets.VITE_FORM_KEY }}
        run: npm run build

      # Pinned, like the actions above. wrangler.jsonc names the Worker and
      # serves ./dist as an SPA.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 deploy --message "$GITHUB_REF_NAME"
