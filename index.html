<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Fitzgeral — Software Engineer | 3D Flight-Sim CV</title>
    <meta name="description" content="The interactive CV of Fitzgeral, a software engineer working across modern frontend, scalable backend architecture, and AI agent workflows. Fly a spaceship through the projects, or read the classic resume." />
    <meta name="keywords" content="Software Engineer, 3D CV, Portfolio, React Three Fiber, WebGL, React, Vite, TypeScript, Hono, PostgreSQL, AI Agent" />
    <meta name="theme-color" content="#020108" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fitzgeral" />
    <meta property="og:title" content="Fitzgeral — Software Engineer | 3D Flight-Sim CV" />
    <meta property="og:description" content="An interactive CV you fly through. Lock orbit around a planet to open the project dossier." />
    <!-- Social images are ABSOLUTE by necessity, not style: scrapers do not
         reliably resolve a relative og:image, and Vite's build-time HTML
         rewriting covers og:image but NOT twitter:image (verified against
         `vite build --base=/3d-portfolio/`), so a relative Twitter URL would
         stay pointed at the domain root and 404 on a project page. Absolute
         URLs need no rewriting and sidestep both problems.
         These four URLs assume the GitHub Pages project page; a custom domain
         means updating og:url, canonical, og:image and twitter:image. -->
    <meta property="og:url" content="https://fitzfitz.github.io/3d-portfolio/" />
    <meta property="og:image" content="https://fitzfitz.github.io/3d-portfolio/og.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Fitzgeral — Software Engineer | 3D Flight-Sim CV" />
    <meta property="twitter:description" content="An interactive CV you fly through. Lock orbit around a planet to open the project dossier." />
    <meta property="twitter:image" content="https://fitzfitz.github.io/3d-portfolio/og.webp" />

    <link rel="canonical" href="https://fitzfitz.github.io/3d-portfolio/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" />

    <!-- Critical first-paint styles: dark background before any bundle arrives -->
    <style>html,body{background:#020108;margin:0}</style>
  </head>
  <body class="bg-background">
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020108;color:#00ff87;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:0.22em">
        INITIALIZING STAR SYSTEM...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
