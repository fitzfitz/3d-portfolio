# Visitor-beacon API for the portfolio. See beacon-api/README.md.
name = "fitz-beacons"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Every host that serves the site: staging on GitHub Pages, and production on
# the Cloudflare Worker (workers.dev and the custom domain porto.fitzgeral.my.id). A host missing here gets
# 403 on /live and no CORS on /beacons: no ghosts, no buoys.
ALLOWED_ORIGINS = "https://fitzfitz.github.io,https://3d-portfolio.fitzgeralmedia.workers.dev,https://porto.fitzgeral.my.id"

[[d1_databases]]
binding = "DB"
database_name = "fitz-beacons"
database_id = "57ee4c74-f2c0-4b24-ba5a-b504dfb990dc"

# Per-pilot request budget (GET and POST): 30 a minute per Cloudflare
# location. Stands in for a WAF rule, which needs a zone and this Worker lives
# on workers.dev. namespace_id is any integer unique to the account.
[[ratelimits]]
name = "LIMITER"
namespace_id = "7301"

  [ratelimits.simple]
  limit = 30
  period = 60

# Live sky (src/sky.ts, the Sky class in src/index.ts): one room of
# hibernatable WebSockets. It stores only the ring race state (src/raceRoom.ts)
# and sets alarms for its deadlines; the Workers Free plan only offers
# SQLite-backed Durable Objects, so it is declared as one.
[[durable_objects.bindings]]
name = "SKY"
class_name = "Sky"

[exports.Sky]
type = "durable-object"
storage = "sqlite"
